name: Start the app in Docker
description: >
  Creates .env from .env.example, builds and starts the containers and runs
  `make setup` (composer install + migrations on app and app_test).
  The same commands a person runs locally, so CI checks exactly that path.
runs:
  using: composite
  steps:
    - name: Create .env from .env.example
      shell: bash
      run: cp .env.example .env
    - name: make up
      shell: bash
      run: make up
    - name: make setup
      shell: bash
      run: make setup

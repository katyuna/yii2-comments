server {
    listen 80;
    server_name _;
    root /app/web;
    index index.php;

    charset utf-8;
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # WebSocket for the live admin list, proxied to Centrifugo:
    # the browser uses the same host and port as the app, so no extra URL or CORS setup is needed
    location /connection/websocket {
        proxy_pass http://centrifugo:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny access to hidden files (.env, .git, ...)
    location ~ /\. {
        deny all;
    }
}

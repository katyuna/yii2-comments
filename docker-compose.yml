# Yii2 Comments — local environment
# Usage: make start (creates .env from .env.example, starts containers, runs migrations)
# App:        http://localhost:${APP_PORT:-8080}
# WebSocket:  ws://localhost:${APP_PORT:-8080}/connection/websocket (nginx proxies it to Centrifugo)

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: comments-php
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      centrifugo:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: comments-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - centrifugo

  mysql:
    image: mysql:8.0
    container_name: comments-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the separate test DB (app_test) on first start
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  centrifugo:
    # Pinned to v5: config below uses v5 environment variable names
    image: centrifugo/centrifugo:v5
    container_name: comments-centrifugo
    command: centrifugo
    environment: &centrifugo-env
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS}
      # Only clients with a valid JWT can connect (Yii issues it to logged-in admins only);
      # they may subscribe to "admin:" channels. History lets a reconnected browser get missed comments.
      CENTRIFUGO_NAMESPACES: '[{"name":"admin","allow_subscribe_for_client":true,"history_size":100,"history_ttl":"300s","force_recovery":true}]'
    ports:
      - "${CENTRIFUGO_PORT:-8000}:8000"
    ulimits: &centrifugo-ulimits
      nofile:
        soft: 65535
        hard: 65535

  # ---------------------------------------------------------------------------
  # Test stand (profile "test"): the same app on the app_test DB with its own Centrifugo,
  # so smoke, UI and E2E tests never touch app data or the real admin channel.
  # Started by `make test-up`; open it at http://localhost:${APP_TEST_PORT:-8081}
  # ---------------------------------------------------------------------------
  php-test:
    profiles: ["test"]
    image: yii2-comments-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: comments-php-test
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    environment:
      # Production-like: no debug panel, no Gii, CSRF on (config/web.php)
      YII_ENV: test
      YII_DEBUG: "0"
      DB_NAME: ${DB_TEST_NAME:-app_test}
      CENTRIFUGO_API_URL: http://centrifugo-test:8000/api
      # All test browsers come from one Docker IP; the limit itself is covered by unit/functional tests
      COMMENT_RATE_LIMIT_PER_MINUTE: "10000"
    depends_on:
      mysql:
        condition: service_healthy
      centrifugo-test:
        condition: service_started

  nginx-test:
    profiles: ["test"]
    image: nginx:1.27-alpine
    container_name: comments-nginx-test
    ports:
      - "${APP_TEST_PORT:-8081}:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-test
      - centrifugo-test

  centrifugo-test:
    profiles: ["test"]
    image: centrifugo/centrifugo:v5
    container_name: comments-centrifugo-test
    command: centrifugo
    environment:
      <<: *centrifugo-env
      # Browsers in the Playwright container open http://nginx-test, a person opens localhost
      CENTRIFUGO_ALLOWED_ORIGINS: http://nginx-test http://localhost:${APP_TEST_PORT:-8081}
    ulimits: *centrifugo-ulimits

  # UI and E2E tests (Playwright). Run: make test-ui / make test-e2e
  playwright:
    profiles: ["test"]
    # Keep the image tag equal to @playwright/test version in tests/e2e/package.json
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: comments-playwright
    working_dir: /e2e
    volumes:
      - ./tests/e2e:/e2e
    # ADMIN_* to log in, DB_* to reset app_test between tests
    env_file: .env
    environment:
      BASE_URL: http://nginx-test
      CI: ${CI:-}
    ipc: host
    depends_on:
      - nginx-test
    command: npx playwright test

volumes:
  mysql-data:
